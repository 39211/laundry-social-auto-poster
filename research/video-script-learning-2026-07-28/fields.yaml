    description: 來源網址、日期、作者與來源類型
    detail_level: detailed
  hook:
    description: 前 1-3 秒的聲音、字幕與視覺鉤子
    detail_level: detailed
  story_contract:
    description: 單一衝突、單一動作、payoff 與 CTA
    detail_level: detailed
