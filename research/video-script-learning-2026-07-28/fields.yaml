    description: 字幕、TTS、音效、節奏、品牌收尾與安全區
    detail_level: detailed
  review:
    description: Grok 與 Sol 的 PASS FAIL 證據及淘汰原因
    detail_level: detailed
  iteration:
    description: 每輪只變更一個變數及 72 小時後的決策指標
    detail_level: detailed
uncertain:
  - X 作者自述成效未經獨立驗證
